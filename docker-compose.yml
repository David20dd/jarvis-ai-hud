services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis-local-only
    ports:
      - "5432:5432"
    volumes:
      - jarvis_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - jarvis_redis:/data

  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      JARVIS_REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://jarvis:jarvis-local-only@postgres:5432/jarvis
      JARVIS_DB_FILE: /data/jarvis_memory.db
      JARVIS_EMBEDDING_PROVIDER: ${JARVIS_EMBEDDING_PROVIDER:-local}
      JARVIS_EMBEDDING_MODEL: ${JARVIS_EMBEDDING_MODEL:-text-embedding-3-small}
      JARVIS_EMBEDDING_DIMENSIONS: ${JARVIS_EMBEDDING_DIMENSIONS:-256}
      JARVIS_PUBLIC_MODE: "true"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODELS: ${OPENAI_MODELS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODELS: ${ANTHROPIC_MODELS:-}
      JARVIS_GOOGLE_GROUNDING_ENABLED: ${JARVIS_GOOGLE_GROUNDING_ENABLED:-false}
      JARVIS_GEMINI_SEARCH_MODEL: ${JARVIS_GEMINI_SEARCH_MODEL:-}
      JARVIS_PROVIDER_ORDER: ${JARVIS_PROVIDER_ORDER:-groq,anthropic,openai,gemini,compatible,ollama}
    ports:
      - "8000:8000"
    volumes:
      - jarvis_data:/data
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  jarvis_postgres:
  jarvis_redis:
  jarvis_data:
